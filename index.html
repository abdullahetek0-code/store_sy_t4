<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nexus Store | Ultimate</title>
  
  <meta name="theme-color" content="#05070a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #05070a; --surface: rgba(20, 25, 35, 0.6); --neon-cyan: #00f0ff; --neon-purple: #b000ff;
      --neon-pink: #ff007f; --neon-green: #39ff14; --neon-red: #ff2e63; --text-main: #ffffff; --text-muted: #94a3b8;
      --glass-border: rgba(255, 255, 255, 0.1); --glass-glow: inset 0 0 20px rgba(0, 240, 255, 0.05), 0 10px 30px rgba(0, 0, 0, 0.7);
      --base-font-size: 16px;
    }
    [data-theme="light"] {
      --bg-dark: #f4f6f9; --surface: rgba(255, 255, 255, 0.85); --neon-cyan: #0077ff; --neon-purple: #7b2cbf;
      --neon-pink: #ff007f; --neon-green: #10b981; --neon-red: #ef4444; --text-main: #1e293b; --text-muted: #64748b;
      --glass-border: rgba(0, 0, 0, 0.08); --glass-glow: inset 0 0 20px rgba(0, 119, 255, 0.05), 0 10px 30px rgba(0, 0, 0, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Cairo', sans-serif; font-size: var(--base-font-size); background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; padding-bottom: 100px; background-image: radial-gradient(circle at 10% 20%, rgba(176, 0, 255, 0.12) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(0, 240, 255, 0.12) 0%, transparent 40%); background-attachment: fixed; transition: background-color 0.4s, color 0.4s; }
    #networkCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 15px; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 5%; position: fixed; width: 100%; top: 0; z-index: 100; background: var(--surface); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border); }
    
    .logo { font-size: 1.3rem; font-weight: 900; background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; user-select: none; }
    
    .search-container { flex: 1; max-width: 400px; margin: 0 20px; position: relative; display: none; }
    @media(min-width: 768px) { .search-container { display: block; } }
    .search-bar { width: 100%; padding: 10px 15px 10px 40px; border-radius: 20px; background: var(--surface); border: 1px solid var(--glass-border); color: var(--text-main); font-family: inherit; outline: none; transition: 0.3s; }
    .search-bar:focus { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0,240,255,0.2); }
    .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.9rem; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .icon-btn { background: var(--surface); border: 1px solid var(--glass-border); color: var(--text-main); width: 38px; height: 38px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.3s; position: relative; }
    .icon-btn:hover { border-color: var(--neon-cyan); color: var(--neon-cyan); }
    .cart-badge { position: absolute; top: -4px; right: -4px; background: var(--neon-pink); color: white; font-size: 0.65rem; font-weight: bold; width: 18px; height: 18px; border-radius: 50%; display: flex; justify-content: center; align-items: center; transform: scale(0); transition: transform 0.3s; }
    .cart-badge.show { transform: scale(1); }
    .owner-name { font-size: 0.8rem; font-weight: 700; color: var(--neon-cyan); display: block; white-space: nowrap; margin-right: 5px; }
    
    .hero-section { padding: 75px 0 10px; display: block; }
    .hero-card { background: var(--surface); border: 1px solid var(--glass-border); border-radius: 20px; padding: 15px 20px; display: flex; align-items: center; gap: 15px; position: relative; overflow: hidden; box-shadow: var(--glass-glow); }
    .hero-img { width: 100px; height: 140px; border-radius: 12px; object-fit: cover; box-shadow: 0 10px 20px rgba(0,0,0,0.5); z-index: 1; background: #1a202c; }
    .hero-info { z-index: 1; flex: 1; }
    .hero-tag { background: rgba(0, 240, 255, 0.15); color: var(--neon-cyan); font-size: 0.7rem; padding: 4px 10px; border-radius: 10px; display: inline-block; margin-bottom: 8px; font-weight: bold; }
    .hero-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 5px; line-height: 1.3; color: var(--text-main); }
    .hero-desc { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .hero-btn { background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple)); color: #fff; border: none; padding: 8px 18px; border-radius: 10px; font-family: inherit; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.3s; }
    .hero-btn:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(0,240,255,0.4); }

    .section-title { font-size: 1.1rem; font-weight: 800; margin: 25px 0 15px; display: flex; align-items: center; gap: 8px; color: var(--text-main); }
    .section-title::before { content: ''; display: block; width: 4px; height: 18px; background: var(--neon-cyan); border-radius: 2px; box-shadow: 0 0 10px var(--neon-cyan); }
    .horizontal-scroll { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 15px; scroll-snap-type: x mandatory; scrollbar-width: none; }
    .horizontal-scroll::-webkit-scrollbar { display: none; }
    .book-card { min-width: 150px; max-width: 150px; background: var(--surface); border: 1px solid var(--glass-border); border-radius: 16px; padding: 10px; scroll-snap-align: start; position: relative; transition: 0.3s; cursor: pointer; backdrop-filter: blur(10px); }
    .book-card:hover { transform: translateY(-5px); border-color: var(--neon-cyan); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
    .book-img-wrap { width: 100%; height: 190px; border-radius: 10px; overflow: hidden; margin-bottom: 10px; position: relative; background: #1a202c; }
    .book-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
    .book-card:hover .book-img-wrap img { transform: scale(1.1); }
    .fav-icon { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); width: 30px; height: 30px; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #fff; font-size: 0.8rem; border: 1px solid rgba(255,255,255,0.2); z-index: 2; transition: 0.3s; }
    .fav-icon.active { color: var(--neon-pink); border-color: var(--neon-pink); background: rgba(255,0,127,0.2); box-shadow: 0 0 10px var(--neon-pink); }
    .fav-icon.read { color: var(--neon-green); border-color: var(--neon-green); background: rgba(57, 255, 20, 0.2); box-shadow: 0 0 10px var(--neon-green); }
    .book-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
    .book-type { font-size: 0.7rem; color: var(--text-muted); }
    
    .premium-badge { position: absolute; top: 8px; left: 8px; z-index: 3; background: linear-gradient(135deg, #ff007f, #b000ff); color: #fff; font-size: 0.55rem; font-weight: 900; padding: 3px 7px; border-radius: 8px; letter-spacing: 0.5px; box-shadow: 0 0 12px rgba(255, 0, 127, 0.7); animation: pulsePremium 2s infinite; }
    @keyframes pulsePremium { 0%, 100% { box-shadow: 0 0 12px rgba(255, 0, 127, 0.7); } 50% { box-shadow: 0 0 22px rgba(255, 0, 127, 1); } }

    .categories { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
    .categories::-webkit-scrollbar { display: none; }
    .cat-btn { background: var(--surface); border: 1px solid var(--glass-border); color: var(--text-muted); padding: 6px 16px; border-radius: 20px; font-family: inherit; font-size: 0.8rem; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.3s; }
    .cat-btn.active { background: var(--neon-cyan); color: #000; border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0,240,255,0.3); }

    .bottom-nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 94%; max-width: 650px; height: 65px; background: rgba(20, 25, 35, 0.4); backdrop-filter: blur(40px) saturate(250%); -webkit-backdrop-filter: blur(40px) saturate(250%); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 35px; display: flex; justify-content: space-around; align-items: center; z-index: 1000; padding: 0 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.1); transition: background 0.4s, border-color 0.4s; }
    [data-theme="light"] .bottom-nav { background: rgba(255, 255, 255, 0.6); border: 1px solid rgba(0, 0, 0, 0.1); box-shadow: 0 10px 40px rgba(0,0,0,0.1), inset 0 0 20px rgba(255,255,255,0.5); }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 0.65rem; font-weight: 600; cursor: pointer; transition: 0.3s; gap: 3px; padding: 5px 10px; border-radius: 20px; }
    .nav-item i { font-size: 1.2rem; }
    .nav-item.active { color: var(--neon-cyan); background: rgba(0, 240, 255, 0.1); text-shadow: 0 0 10px rgba(0,240,255,0.5); }
    .nav-item.active i { transform: translateY(-2px); filter: drop-shadow(0 0 5px var(--neon-cyan)); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 2000; display: flex; justify-content: center; align-items: flex-end; opacity: 0; visibility: hidden; transition: 0.3s; }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-content { width: 100%; max-width: 600px; background: var(--bg-dark); border-radius: 24px 24px 0 0; border: 1px solid var(--glass-border); border-bottom: none; padding: 25px 20px; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); max-height: 85vh; overflow-y: auto; position: relative; }
    .modal-overlay.active .modal-content { transform: translateY(0); }
    .close-modal { position: absolute; top: 15px; left: 15px; background: var(--surface); border: 1px solid var(--glass-border); color: var(--text-main); width: 32px; height: 32px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 10; }
    .modal-header { display: flex; gap: 15px; margin-bottom: 20px; }
    .modal-img { width: 100px; height: 140px; border-radius: 12px; object-fit: cover; box-shadow: 0 5px 15px rgba(0,0,0,0.5); background: #1a202c;}
    .modal-info { flex: 1; }
    .modal-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 5px; color: var(--text-main); }
    .modal-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 15px; }
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .action-btn { padding: 12px; border-radius: 12px; font-family: inherit; font-weight: bold; font-size: 0.9rem; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; border: none; transition: 0.3s; }
    .btn-read { background: var(--surface); color: var(--text-main); border: 1px solid var(--glass-border); }
    .btn-download { background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple)); color: #fff; }
    .btn-read:hover, .btn-download:hover { transform: scale(1.02); }
    .btn-quiz { background: linear-gradient(90deg, #f59e0b, #ef4444); color: #fff; grid-column: span 2; margin-top: 5px; }
    .btn-study { background: var(--neon-green); color: #000; grid-column: span 2; margin-top: 5px; }

    .premium-modal-content { background: linear-gradient(160deg, #1a0010, #05070a) !important; border: 2px solid var(--neon-pink) !important; box-shadow: 0 0 40px rgba(255, 0, 127, 0.5), inset 0 0 30px rgba(176, 0, 255, 0.2) !important; }
    .premium-crown { font-size: 4rem; text-align: center; background: linear-gradient(135deg, #FFD700, #FFA500, #FFD700); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.6)); animation: floatCrown 3s ease-in-out infinite; }
    @keyframes floatCrown { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .premium-title { text-align: center; font-size: 1.6rem; font-weight: 900; margin: 15px 0 10px; background: linear-gradient(90deg, #FFD700, #ff007f, #b000ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .premium-soon { text-align: center; color: var(--neon-cyan); font-size: 1rem; font-weight: 800; margin-bottom: 20px; letter-spacing: 1px; }
    .premium-desc { text-align: center; color: var(--text-muted); font-size: 0.9rem; line-height: 1.7; margin-bottom: 25px; }

    .pdf-modal .modal-content { height: 90vh; padding: 0; display: flex; flex-direction: column; }
    .pdf-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: var(--surface); border-bottom: 1px solid var(--glass-border); }
    .pdf-frame { flex: 1; width: 100%; border: none; background: #333; }

    .sidebar { position: fixed; top: 0; right: -100%; width: 85%; max-width: 350px; height: 100vh; background: var(--bg-dark); z-index: 3000; border-left: 1px solid var(--glass-border); transition: right 0.4s; display: flex; flex-direction: column; }
    .sidebar.active { right: 0; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; }
    .sidebar-items { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .sidebar-footer { padding: 20px; border-top: 1px solid var(--glass-border); }

    .mobile-search-overlay { position: fixed; inset: 0; background: var(--bg-dark); z-index: 4000; display: none; flex-direction: column; padding: 20px; }
    .mobile-search-overlay.active { display: flex; }
    .mobile-search-input { width: 100%; padding: 15px; border-radius: 15px; background: var(--surface); border: 1px solid var(--glass-border); color: var(--text-main); font-family: inherit; font-size: 1rem; margin-bottom: 20px; outline: none; }
    .mobile-search-results { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }

    .info-card { background: var(--surface); border: 1px solid var(--glass-border); border-radius: 20px; padding: 30px; text-align: center; box-shadow: var(--glass-glow); }
    .info-card i.main-icon { font-size: 3rem; color: var(--neon-cyan); margin-bottom: 15px; }
    .info-card h3 { color: var(--text-main); margin-bottom: 10px; font-size: 1.2rem; }
    .info-card p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.6; margin-bottom: 20px; }

    .theme-btn { background: var(--surface); color: var(--text-main); border: 1px solid var(--glass-border); padding: 12px 24px; border-radius: 12px; font-family: inherit; font-weight: bold; font-size: 1rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; }
    .theme-btn:hover { border-color: var(--neon-cyan); color: var(--neon-cyan); }

    .contact-grid { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
    .contact-action-btn { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 16px; border-radius: 16px; color: #fff; text-decoration: none; font-size: 1.1rem; font-weight: 700; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); position: relative; overflow: hidden; border: none; cursor: pointer; }
    .contact-action-btn i { font-size: 1.5rem; }
    .contact-action-btn:hover { transform: translateY(-3px) scale(1.02); }
    .btn-whatsapp { background: linear-gradient(135deg, #25D366, #128C7E); box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4); }
    .btn-email { background: linear-gradient(135deg, #ea4335, #b31412); box-shadow: 0 8px 25px rgba(234, 67, 53, 0.4); }
    .contact-action-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: left 0.5s; }
    .contact-action-btn:hover::before { left: 100%; }

    .tool-card { min-width: 180px; max-width: 180px; background: linear-gradient(145deg, var(--surface), rgba(0, 240, 255, 0.05)); border: 1px solid var(--glass-border); border-radius: 16px; padding: 12px; cursor: pointer; transition: 0.3s; position: relative; }
    .tool-card:hover { transform: translateY(-5px) scale(1.02); border-color: var(--neon-cyan); box-shadow: 0 10px 25px rgba(0, 240, 255, 0.3); }
    .tool-icon-wrap { width: 100%; height: 100px; border-radius: 12px; background: linear-gradient(135deg, #306998, #FFD43B); display: flex; justify-content: center; align-items: center; margin-bottom: 10px; position: relative; overflow: hidden; }
    .tool-icon-wrap::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.3), transparent 60%); }
    .tool-icon-wrap i { font-size: 3rem; color: #fff; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); z-index: 1; }

    .settings-row { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 15px 0; border-bottom: 1px solid var(--glass-border); text-align: right; }
    .settings-row:last-child { border-bottom: none; }
    .settings-row h3 { margin-bottom: 5px; font-size: 1rem; }
    .settings-row p { margin-bottom: 0; font-size: 0.8rem; }
    .settings-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .settings-btn { padding: 8px 12px; font-size: 0.85rem; }

    .site-footer { text-align: center; padding: 25px 0 15px 0; color: var(--text-muted); font-size: 0.85rem; margin-top: 30px; border-top: 1px solid var(--glass-border); font-weight: 600; }

    .quiz-option { background: var(--surface); border: 1px solid var(--glass-border); padding: 12px; border-radius: 10px; margin-bottom: 10px; cursor: pointer; transition: 0.3s; text-align: right; font-size: 0.95rem;}
    .quiz-option:hover { border-color: var(--neon-cyan); }
    .quiz-option.correct { background: rgba(57, 255, 20, 0.2); border-color: var(--neon-green); }
    .quiz-option.wrong { background: rgba(255, 46, 99, 0.2); border-color: var(--neon-red); }
    .lock-input { width: 100%; padding: 12px; border-radius: 10px; background: rgba(0,0,0,0.5); border: 1px solid var(--neon-pink); color: #fff; text-align: center; font-family: inherit; font-size: 1rem; margin-bottom: 10px; outline: none; }
    .device-id-box { background: rgba(0,0,0,0.6); border: 1px dashed var(--neon-cyan); padding: 10px; border-radius: 10px; text-align: center; font-family: monospace; font-size: 1.1rem; color: var(--neon-cyan); margin-bottom: 15px; letter-spacing: 2px; font-weight: bold;}

    /* Admin Panel Styles */
    #adminPanel { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; flex-direction: column; padding: 20px; color: #fff; overflow-y: auto; }
    .admin-input { width: 100%; padding: 15px; border-radius: 10px; background: #111; border: 1px solid var(--neon-cyan); color: #fff; font-size: 1.2rem; text-align: center; margin-bottom: 15px; outline: none; direction: ltr; }
    .admin-btn { width: 100%; padding: 15px; border-radius: 10px; background: var(--neon-cyan); color: #000; font-weight: bold; font-size: 1.1rem; border: none; cursor: pointer; }
    .admin-result { margin-top: 20px; padding: 20px; background: #111; border: 1px solid var(--neon-green); border-radius: 10px; text-align: center; font-size: 1.5rem; font-weight: bold; color: var(--neon-green); direction: ltr; }
  </style>
</head>
<body>

  <!-- شاشة المالك السرية -->
  <div id="adminPanel">
    <h1 style="text-align: center; color: var(--neon-cyan); margin-bottom: 20px;">👑 لوحة تحكم المالك</h1>
    <p style="text-align: center; margin-bottom: 20px; color: #888;">أدخل رقم جهاز الطالب لتوليد كود التفعيل الخاص به.</p>
    <input type="text" id="adminInput" class="admin-input" placeholder="NX-XXXXXX">
    <button class="admin-btn" onclick="adminGenerate()">توليد الكود</button>
    <div id="adminResult" class="admin-result" style="display: none;"></div>
    <button class="theme-btn" onclick="exitAdmin()" style="margin-top: 30px; background: transparent; border: 1px solid #fff; color: #fff;">خروج</button>
  </div>

  <canvas id="networkCanvas"></canvas>

  <header>
    <!-- هنا أضفنا onclick للشعار للفتح السري -->
    <div class="logo" onclick="secretAdminTap()">Nexus Store</div>
    <div class="search-container">
      <i class="fas fa-search search-icon"></i>
      <input type="text" class="search-bar" id="desktopSearch" placeholder="ابحث عن ملفك هنا...">
    </div>
    <div class="header-actions">
      <span class="owner-name">𝒂𝒃𝒅𝒖𝒍𝒍𝒂𝒉𝒆𝒕𝒆𝒌</span>
      <button class="icon-btn" onclick="toggleMobileSearch()"><i class="fas fa-search"></i></button>
      <button class="icon-btn" onclick="toggleSidebar(true)"><i class="fas fa-shopping-basket"></i><span class="cart-badge" id="cartBadge">0</span></button>
    </div>
  </header>

  <div class="container">
    <section class="hero-section" id="heroSection">
      <div class="hero-card" id="heroCard"></div>
    </section>
    
    <div class="categories" id="categoriesContainer">
      <button class="cat-btn active" onclick="filterCategory('all', this)">الكل</button>
      <button class="cat-btn" onclick="filterCategory('philosophy', this)">فلسفة</button>
      <button class="cat-btn" onclick="filterCategory('arabic', this)">عربي</button>

      { id: 'scanner', title: 'Network Scanner V4', type: 'Ultimate Network Recon', desc: 'أداة شاملة لفحص الشبكة، اكتشاف الأجهزة، فحص المنافذ، وتحديد نظام التشغيل. مبنية بـ Python + Pygame.', sourceId: 'scanner-source', filename: 'network_scanner.py', icon: 'fab fa-python' }

    if (localStorage.getItem('theme') === 'light') document.body.setAttribute('data-theme', 'light');
    const savedFontSize = localStorage.getItem('nexus_font_size') || '16px';
    document.documentElement.style.setProperty('--base-font-size', savedFontSize);

    const canvas = document.getElementById('networkCanvas'), ctx = canvas.getContext('2d');
    let width, height, particles = [];
    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();
    class Particle {
      constructor() { this.x = Math.random() * width; this.y = Math.random() * height; this.vx = (Math.random() - 0.5) * 0.5; this.vy = (Math.random() - 0.5) * 0.5; this.radius = Math.random() * 1.5 + 0.5; }
      update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > width) this.vx *= -1; if (this.y < 0 || this.y > height) this.vy *= -1; }
      draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0, 240, 255, 0.4)'; ctx.fill(); }
    }
    for (let i = 0; i < 50; i++) particles.push(new Particle());
    function animate() { ctx.clearRect(0, 0, width, height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); } animate();

    function createCard(book) {
      const isFav = favorites.includes(book.id);
      const isRead = readBooks.includes(book.id);
      const badge = book.premium ? `<span class="premium-badge">⭐ PREMIUM</span>` : '';
      let favClass = 'fav-icon';
      if (isRead) favClass += ' read';
      else if (isFav) favClass += ' active';

      return `
        <div class="book-card" onclick="openDetails(${book.id})">
          <div class="book-img-wrap">
            ${badge}
            <img src="${book.img}" alt="${book.title}" loading="lazy">
            <div class="${favClass}" onclick="toggleFav(event, ${book.id})">
              <i class="fas ${isRead ? 'fa-check' : 'fa-heart'}"></i>
            </div>
          </div>
          <h3 class="book-title">${book.title}</h3>
          <span class="book-type">${book.type}</span>
        </div>`;
    }

    }

    function toggleFav(e, id) {
      e.stopPropagation();
      if (readBooks.includes(id)) {
        readBooks = readBooks.filter(x => x !== id);
        favorites.push(id);
      } else if (favorites.includes(id)) {
        favorites = favorites.filter(x => x !== id);
        readBooks.push(id);
      } else {
        favorites.push(id);
      }
      localStorage.setItem('nexus_favs_v4', JSON.stringify(favorites));
      localStorage.setItem('nexus_read_v4', JSON.stringify(readBooks));
      
      const activeNav = document.querySelector('.nav-item.active');
      if(activeNav) activeNav.click();
      if(document.getElementById('detailsModal').classList.contains('active')) openDetails(id);
    }

    function addToRecent(id) {
      recentlyViewed = recentlyViewed.filter(x => x !== id);
      recentlyViewed.unshift(id);
      if (recentlyViewed.length > 4) recentlyViewed.pop();
      localStorage.setItem('nexus_recent_v4', JSON.stringify(recentlyViewed));
    }

    function getDefaultDetailsHTML() {

    function openDetails(id) {
      currentBook = booksData.find(b => b.id === id);
      if (!currentBook) return;
      
      addToRecent(id);
      
      const content = document.getElementById('detailsModalContent');
      
      // إعادة التحقق من الوقت عند كل فتح
      unlockExpiry = parseInt(localStorage.getItem('nexus_premium_expiry') || '0');
      isUnlocked = Date.now() < unlockExpiry;

      if (currentBook.premium && !isUnlocked) {
        if(timerInterval) clearInterval(timerInterval);
        content.classList.add('premium-modal-content');
        const waText = encodeURIComponent(`مرحباً، أريد شراء نوطة أحمد الحامض.\nرقم جهازي هو: ${deviceId}`);
        
        content.innerHTML = `
          <button class="close-modal" onclick="closeDetails()"><i class="fas fa-times"></i></button>

          <h2 class="premium-title">${currentBook.title}</h2>

            <i class="fab fa-whatsapp"></i> مراسلة المالك (${currentBook.price}$)
          </a>`;
      } else {
        content.classList.remove('premium-modal-content');
        content.innerHTML = getDefaultDetailsHTML();
        document.getElementById('modalImg').src = currentBook.img;
        document.getElementById('modalTitle').textContent = currentBook.title;

        document.getElementById('modalType').textContent = 'التصنيف: ' + currentBook.type;
        
        // إضافة العداد التنازلي إذا كانت النوطة مميزة ومفتوحة

        const isRead = readBooks.includes(currentBook.id);
        let extraBtns = `<button class="action-btn btn-study" onclick="markAsStudied(${currentBook.id})" style="background:${isRead ? 'var(--text-muted)' : 'var(--neon-green)'}">

           extraBtns += `<button class="action-btn btn-quiz" onclick="startQuiz(${currentBook.id})"><i class="fas fa-brain"></i> اختبر معلوماتك</button>`;
        }

      document.getElementById('detailsModal').classList.add('active');
    }

    function startCountdown() {
        if(timerInterval) clearInterval(timerInterval);
        const display = document.getElementById('premiumTimerDisplay');
        
        timerInterval = setInterval(() => {
            const now = Date.now();
            const remaining = Math.max(0, Math.floor((unlockExpiry - now) / 1000));
            
            if (remaining <= 0) {
                clearInterval(timerInterval);
                display.innerHTML = "⏱️ انتهى الوقت!";
                alert('انتهت مهلة الوصول (30 دقيقة). يرجى إدخال كود التفعيل مجدداً.');
                localStorage.removeItem('nexus_premium_expiry'); // حذف الوقت
                closeDetails();
                return;
            }
            
            const minutes = Math.floor(remaining / 60);
            const seconds = remaining % 60;
            display.innerHTML = `⏱️ الوقت المتبقي: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }, 1000);
    }

    function generateCode(id) {
        const secret = "NexusStore2026!";
        let str = id + secret;
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            hash = (hash << 5) - hash + str.charCodeAt(i);
            hash |= 0; 
        }
        let hex = Math.abs(hash).toString(16).toUpperCase();
        while (hex.length < 8) hex = "0" + hex;
        return "NX-" + hex;
    }

    function verifyCode() {
      const enteredCode = document.getElementById('unlockCode').value.trim().toUpperCase();
      const expectedCode = generateCode(deviceId);
      
      if (enteredCode === expectedCode) {
        // حفظ وقت الانتهاء (الآن + 30 دقيقة)
        const expiry = Date.now() + (30 * 60 * 1000);
        localStorage.setItem('nexus_premium_expiry', expiry);
        isUnlocked = true;
        
        alert('✅ تم فك القفل بنجاح لمدة 30 دقيقة!');
        openDetails(currentBook.id); 
      } else {
        alert('❌ كود غير صحيح أو مخصص لجهاز آخر.\nتأكد من نسخ رقم جهازك بشكل صحيح للمالك.');
      }
    }

    function copyDeviceId() {
        navigator.clipboard.writeText(deviceId).then(() => {
            alert('✅ تم نسخ رقم الجهاز: ' + deviceId);
        }).catch(() => {
            alert('رقم جهازك هو: ' + deviceId);
        });
    }

    function markAsStudied(id) {
      if (readBooks.includes(id)) { readBooks = readBooks.filter(x => x !== id); } 
      else { readBooks.push(id); favorites = favorites.filter(x => x !== id); }
      localStorage.setItem('nexus_read_v4', JSON.stringify(readBooks));
      localStorage.setItem('nexus_favs_v4', JSON.stringify(favorites));
      openDetails(id);
      const activeNav = document.querySelector('.nav-item.active');
      if(activeNav) activeNav.click();
    }

    function closeDetails() {
        if(timerInterval) clearInterval(timerInterval);
        document.getElementById('detailsModal').classList.remove('active');
    }

    function readCurrentFile() {
      if (!currentBook || !currentBook.file) return;
      document.getElementById('pdfTitle').textContent = currentBook.title;
      document.getElementById('pdfFrame').src = encodeURI(currentBook.file);
      document.getElementById('pdfModal').classList.add('active');
    }

    function closePdf() {
      document.getElementById('pdfModal').classList.remove('active');
      document.getElementById('pdfFrame').src = '';
    }

    function addCurrentToCart() {
      if (!currentBook || !currentBook.file) return;
      if (!cart.some(item => item.id === currentBook.id)) {
        cart.push(currentBook);
        updateCartUI();
        const badge = document.getElementById('cartBadge');
        badge.style.transform = 'scale(1.5)';
        setTimeout(() => badge.style.transform = 'scale(1)', 200);
      }
      closeDetails();
      toggleSidebar(true);
    }

    function updateCartUI() {
      const cartItems = document.getElementById('cartItems');
      const badge = document.getElementById('cartBadge');
      if (cart.length === 0) {
        cartItems.innerHTML = '<p style="text-align: center; color: var(--text-muted); margin-top: 20px;">السلة فارغة</p>';
        badge.classList.remove('show');
      } else {
        badge.textContent = cart.length;
        badge.classList.add('show');
        cartItems.innerHTML = cart.map(item => `
          <div style="background: var(--surface); padding: 10px; border-radius: 10px; border: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 0.85rem; font-weight: bold; color: var(--text-main);">${item.title}</span>
            <button onclick="removeFromCart(${item.id})" style="background: none; border: none; color: var(--neon-pink); cursor: pointer;"><i class="fas fa-trash"></i></button>
          </div>`).join('');
      }
    }

    function removeFromCart(id) { cart = cart.filter(item => item.id !== id); updateCartUI(); }
    function toggleSidebar(open) {
      document.getElementById('cartSidebar').classList.toggle('active', open);
      document.getElementById('sidebarOverlay').classList.toggle('active', open);
    }

    function downloadAll() {
      if (cart.length === 0) return;
      cart.forEach((item, index) => {
        if (!item.file) return;
        setTimeout(() => {
          const link = document.createElement('a');
          link.href = encodeURI(item.file);
          link.download = item.title + '.pdf';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        }, index * 1000);
      });
      cart = []; updateCartUI(); toggleSidebar(false);
    }

    function filterCategory(cat, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('heroSection').style.display = 'none';
      const filtered = cat === 'all' ? booksData : booksData.filter(b => b.cat === cat);
      document.getElementById('dynamicSections').innerHTML = `
        <h2 class="section-title" style="margin-top: 80px;">نتائج التصنيف (${filtered.length})</h2>
        <div class="horizontal-scroll" style="flex-wrap: wrap; overflow-x: hidden;">
          ${filtered.map(createCard).join('')}
        </div>`;
    }

    function isMatch(text, term) {
      if (text.includes(term)) return true;
      let tIdx = 0;
      for (let i = 0; i < text.length; i++) {
        if (text[i] === term[tIdx]) tIdx++;
        if (tIdx === term.length) return true;
      }
      return false;
    }

    document.getElementById('desktopSearch').addEventListener('input', (e) => {
      const term = e.target.value.trim().toLowerCase();
      const sectionsContainer = document.getElementById('dynamicSections');
      if (term === '') { initHome(); document.getElementById('heroSection').style.display = 'block'; return; }
      document.getElementById('heroSection').style.display = 'none';
      const filtered = booksData.filter(b => isMatch(b.title.toLowerCase(), term) || isMatch(b.type.toLowerCase(), term));
      sectionsContainer.innerHTML = `
        <h2 class="section-title" style="margin-top: 80px;">نتائج البحث الذكي (${filtered.length})</h2>
        <div class="horizontal-scroll" style="flex-wrap: wrap; overflow-x: hidden;">
          ${filtered.length > 0 ? filtered.map(createCard).join('') : '<p style="color: var(--text-muted);">لا توجد نتائج مطابقة</p>'}
        </div>`;
    });

    function toggleMobileSearch() {
      document.getElementById('mobileSearchOverlay').classList.toggle('active');
      if (document.getElementById('mobileSearchOverlay').classList.contains('active')) document.getElementById('mobileSearchInput').focus();
    }

    function handleMobileSearch(term) {
      term = term.trim().toLowerCase();
      const results = document.getElementById('mobileSearchResults');
      if (term === '') { results.innerHTML = ''; return; }
      const filtered = booksData.filter(b => isMatch(b.title.toLowerCase(), term));
      results.innerHTML = filtered.map(b => `
        <div style="padding: 10px; border-bottom: 1px solid var(--glass-border); cursor: pointer;" onclick="openDetails(${b.id}); toggleMobileSearch();">
          <div style="font-weight: bold; color: var(--text-main);">${b.title}</div>
          <div style="font-size: 0.75rem; color: var(--neon-cyan);">${b.type}</div>
        </div>`).join('');
    }

    function getToolSource(sourceId) { return document.getElementById(sourceId) ? document.getElementById(sourceId).textContent : ''; }
    function downloadTool(toolId) {
      const tool = toolsData.find(t => t.id === toolId);
      if (!tool) return;
      const source = getToolSource(tool.sourceId).trim();
      if (!source || source.length < 500) { alert('⚠️ كود الأداة غير موجود!'); return; }
      const blob = new Blob([source], { type: 'text/x-python;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = tool.filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
    }
    function viewToolCode(toolId) {
      const tool = toolsData.find(t => t.id === toolId);
      if (!tool) return;
      const source = getToolSource(tool.sourceId).trim();
      if (!source || source.length < 500) { alert('⚠️ كود الأداة غير موجود!'); return; }
      const w = window.open('', '_blank');
      if (w) {
        w.document.write('<html dir="ltr"><head><title>' + tool.title + '</title><style>body{background:#1e1e1e;color:#d4d4d4;font-family:monospace;padding:20px;font-size:13px;line-height:1.5;}pre{white-space:pre-wrap;word-wrap:break-word;}h1{color:#00f0ff;border-bottom:2px solid #00f0ff;padding-bottom:10px;}</style></head><body><h1>' + tool.title + '</h1><pre>' + source.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</pre></body></html>');
        w.document.close();
      }
    }

    function generatePassword() {
      const length = 16;
      const charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+~`|}{[]:;?><,./-=";
      let retVal = "";
      for (let i = 0, n = charset.length; i < length; ++i) {
        retVal += charset.charAt(Math.floor(Math.random() * n));
      }
      document.getElementById('passwordResult').innerText = retVal;
    }

    let currentQuiz = null;
    function startQuiz(id) {
      currentQuiz = quizzesData[id];
      renderQuiz();
      document.getElementById('detailsModal').classList.remove('active');
      document.getElementById('quizModal').classList.add('active');
    }

    function renderQuiz() {
      const container = document.getElementById('quizModalContent');
      if (!currentQuiz || currentQuiz.length === 0) {
        container.innerHTML = `<h2>لا توجد أسئلة متاحة لهذا الملف حالياً.</h2><button class="close-modal" onclick="document.getElementById('quizModal').classList.remove('active')"><i class="fas fa-times"></i></button>`;
        return;
      }
      let html = `<button class="close-modal" onclick="document.getElementById('quizModal').classList.remove('active')"><i class="fas fa-times"></i></button>
                  <h2 class="section-title">اختبر معلوماتك</h2>`;
      currentQuiz.forEach((q, qIndex) => {
        html += `<div style="margin-bottom: 25px;">
                  <p style="font-weight: bold; margin-bottom: 10px; font-size: 1.1rem;">${qIndex + 1}. ${q.q}</p>
                  ${q.a.map((opt, oIndex) => `<div class="quiz-option" onclick="checkAnswer(this, ${oIndex === q.c})">${opt}</div>`).join('')}
                 </div>`;
      });
      container.innerHTML = html;
    }

    function checkAnswer(el, isCorrect) {
      if (isCorrect) el.classList.add('correct');
      else el.classList.add('wrong');
    }

    function shareSite() {
      if (navigator.share) {
        navigator.share({ title: 'Nexus Store', text: 'مكتبتك الرقمية - تصفح أفضل الملفات والنوطات', url: window.location.href }).catch(console.error);
      } else {
        navigator.clipboard.writeText(window.location.href).then(() => { alert('✅ تم نسخ رابط الموقع بنجاح!'); }).catch(() => { alert('الرابط: ' + window.location.href); });
      }
    }
    function setFontSize(size) {
      let px = '16px';
      if (size === 'small') px = '14px';
      if (size === 'large') px = '18px';
      document.documentElement.style.setProperty('--base-font-size', px);
      localStorage.setItem('nexus_font_size', px);
      alert('✅ تم تغيير حجم الخط');
    }
    function clearFavorites() {
      if (confirm('هل أنت متأكد من مسح جميع الملفات المفضلة؟')) {
        favorites = []; localStorage.setItem('nexus_favs_v4', '[]');
        switchTab('favorites', document.querySelectorAll('.nav-item')[1]);
        alert('✅ تم مسح المفضلة');
      }
    }
    function clearCart() {
      if (cart.length === 0) { alert('السلة فارغة بالفعل'); return; }
      if (confirm('هل أنت متأكد من مسح جميع الملفات من سلة التحميل؟')) {
        cart = []; updateCartUI(); alert('✅ تم مسح السلة');
      }
    }
    
    function resetPremiumLock() {
        if(confirm('إذا قمت بمسح القفل، ستحتاج إلى كود جديد لفتح النوطة المميزة. هل أنت متأكد؟')) {
            localStorage.removeItem('nexus_premium_expiry');
            isUnlocked = false;
            alert('✅ تم مسح قفل النوطة من هذا الجهاز.');
            switchTab('settings', document.querySelectorAll('.nav-item')[3]);
        }
    }

    function switchTab(tab, el) {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      el.classList.add('active');
      const container = document.getElementById('dynamicSections');
      const heroSection = document.getElementById('heroSection');
      
      if (tab === 'home') { 
        heroSection.style.display = 'block';
        initHome(); 
      }
      else if (tab === 'favorites') {
        heroSection.style.display = 'none';
        const favs = booksData.filter(b => favorites.includes(b.id));
        const reads = booksData.filter(b => readBooks.includes(b.id));
        let html = `<h2 class="section-title" style="margin-top: 80px;">قيد الدراسة (${favs.length})</h2>
        <div class="horizontal-scroll" style="flex-wrap: wrap; overflow-x: hidden;">
          ${favs.length > 0 ? favs.map(createCard).join('') : '<p style="color: var(--text-muted);">لا يوجد ملفات.</p>'}
        </div>`;
        if(reads.length > 0) {
          html += `<h2 class="section-title" style="margin-top: 30px; color: var(--neon-green);">تمت الدراسة (${reads.length})</h2>
          <div class="horizontal-scroll" style="flex-wrap: wrap; overflow-x: hidden;">
            ${reads.map(createCard).join('')}
          </div>`;
        }
        container.innerHTML = html;
      }
      else if (tab === 'python') {
        heroSection.style.display = 'none';
        container.innerHTML = `
          <h2 class="section-title" style="margin-top: 80px;">أدوات بايثون للأمن السيبراني</h2>
          <div class="horizontal-scroll" style="flex-wrap: wrap; overflow-x: hidden;">
            ${toolsData.map(createToolCard).join('')}
          </div>
          ${toolsData.map(tool => `
            <h2 class="section-title" style="margin-top: 30px;">${tool.title}</h2>
            <div class="info-card" style="text-align: right; margin-bottom: 20px;">
              <div style="display: flex; gap: 15px; align-items: center; margin-bottom: 15px;">
                <div class="tool-icon-wrap" style="width: 80px; height: 80px; margin: 0;"><i class="${tool.icon}"></i></div>
                <div style="flex: 1;">
                  <h3 style="margin-bottom: 5px; text-align: right;">${tool.title}</h3>
                  <p style="margin: 0; font-size: 0.85rem;">${tool.desc}</p>
                </div>
              </div>
              <div class="action-grid" style="max-width: 500px;">
                <button class="action-btn btn-read" onclick="viewToolCode('${tool.id}')"><i class="fas fa-code"></i> عرض الكود</button>
                <button class="action-btn btn-download" onclick="downloadTool('${tool.id}')"><i class="fas fa-download"></i> تحميل الأداة</button>
              </div>
            </div>`).join('')}
            
          <h2 class="section-title" style="margin-top: 30px;">مولد كلمات المرور الذكي</h2>
          <div class="info-card" style="text-align: center;">
            <i class="fas fa-key main-icon"></i>
            <h3>احمِ حساباتك بكلمة مرور قوية</h3>
            <p style="margin-bottom: 15px;">أداة سريعة لتوليد كلمات مرور عشوائية وآمنة.</p>
            <div id="passwordResult" style="font-family: monospace; font-size: 1.2rem; background: #000; padding: 15px; border-radius: 10px; margin-bottom: 15px; color: var(--neon-cyan); letter-spacing: 1px;">اضغط لتوليد كلمة المرور</div>
            <button class="theme-btn" onclick="generatePassword()" style="background: var(--neon-cyan); color: #000; border: none; font-weight: bold; width: 100%;">توليد كلمة المرور</button>
          </div>
        `;
      }
      else if (tab === 'settings') {
        heroSection.style.display = 'none';
        const isLight = document.body.getAttribute('data-theme') === 'light';
        container.innerHTML = `
          <h2 class="section-title" style="margin-top: 80px;">الإعدادات</h2>
          <div class="info-card">
            <div class="settings-row">
              <div><h3>مظهر الموقع</h3><p style="color: var(--text-muted);">تبديل بين الوضع الداكن والفاتح</p></div>
              <button class="theme-btn" onclick="toggleTheme()"><i class="fas fa-${isLight ? 'sun' : 'moon'}"></i> ${isLight ? 'فاتح' : 'داكن'}</button>
            </div>
            <div class="settings-row">
              <div><h3>مشاركة الموقع</h3><p style="color: var(--text-muted);">شارك رابط الموقع مع أصدقائك</p></div>
              <button class="theme-btn settings-btn" onclick="shareSite()"><i class="fas fa-share-alt"></i> مشاركة</button>
            </div>
            <div class="settings-row">
              <div><h3>حجم الخط</h3><p style="color: var(--text-muted);">تغيير حجم النص في الموقع</p></div>
              <div class="settings-actions">
                <button class="theme-btn settings-btn" onclick="setFontSize('small')">ص</button>
                <button class="theme-btn settings-btn" onclick="setFontSize('medium')">م</button>
                <button class="theme-btn settings-btn" onclick="setFontSize('large')">ك</button>
              </div>
            </div>
            <div class="settings-row">
              <div><h3>مسح البيانات</h3><p style="color: var(--text-muted);">إفراغ المفضلة أو السلة</p></div>
              <div class="settings-actions">
                <button class="theme-btn settings-btn" style="color: var(--neon-pink); border-color: var(--neon-pink);" onclick="clearFavorites()">المفضلة</button>
                <button class="theme-btn settings-btn" style="color: var(--neon-pink); border-color: var(--neon-pink);" onclick="clearCart()">السلة</button>
              </div>
            </div>
            <div class="settings-row" style="border-top: 1px solid var(--glass-border); margin-top: 10px; padding-top: 15px;">
              <div><h3 style="color: var(--neon-cyan);">إدارة الترخيص (Premium)</h3><p style="color: var(--text-muted);">إزالة قفل النوطة من هذا الجهاز</p></div>
              <button class="theme-btn settings-btn" style="color: var(--neon-cyan); border-color: var(--neon-cyan);" onclick="resetPremiumLock()">إعادة تعيين القفل</button>
            </div>
          </div>`;
      }
      else if (tab === 'contact') {
        heroSection.style.display = 'none';
        container.innerHTML = `
          <h2 class="section-title" style="margin-top: 80px;">اتصل بنا</h2>
          <div class="info-card">
            <i class="fas fa-headset main-icon"></i>
            <h3>نحن هنا لمساعدتك</h3>
            <p>لأي استفسارات أو اقتراحات، لا تتردد في التواصل معنا مباشرة:</p>
            <div class="contact-grid">
              <a href="https://wa.me/306992229656" target="_blank" class="contact-action-btn btn-whatsapp"><i class="fab fa-whatsapp"></i> مراسلة عبر واتساب</a>
              <a href="mailto:abdullahetek0@gmail.com" target="_blank" class="contact-action-btn btn-email"><i class="fas fa-envelope"></i> مراسلة عبر البريد</a>
            </div>
          </div>`;
      }
    }

    function toggleTheme() {
      const body = document.body;
      if (body.getAttribute('data-theme') === 'light') { body.removeAttribute('data-theme'); localStorage.setItem('theme', 'dark'); }
      else { body.setAttribute('data-theme', 'light'); localStorage.setItem('theme', 'light'); }
      switchTab('settings', document.querySelectorAll('.nav-item')[3]);
    }

    initHome();
    updateCartUI();
  </script>
